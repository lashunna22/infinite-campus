<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Campus</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:#555;
  background:#fff;
}

body{
  font-size:14px;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

:root{
  --green:#b6e000;
  --blue:#4c9dcc;
  --sidebar:#293536;
  --sidebar2:#344143;
  --line:#d8d8d8;
  --text:#555;
  --link:#4c83a8;
}


/* =========================
   TOP BAR
========================= */

.topbar{
  height:58px;
  background:var(--green);
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
  display:flex;
  align-items:center;
  box-shadow:0 1px 3px #7775;
}

.menu-button{
  width:58px;
  height:58px;
  border:0;
  background:transparent;
  color:#344000;
  font-size:27px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  height:58px;
  display:flex;
  align-items:center;
  color:#364000;
  gap:7px;
}

.logo-mark{
  width:34px;
  height:26px;
  position:relative;
}

.logo-mark:before,
.logo-mark:after{
  content:"";
  position:absolute;
  border:3px solid #435000;
  border-radius:50%;
  width:22px;
  height:12px;
  top:6px;
  transform:rotate(-25deg);
}

.logo-mark:before{
  left:1px;
}

.logo-mark:after{
  left:10px;
  transform:rotate(25deg);
}

.logo-text{
  font-size:17px;
  line-height:15px;
  font-weight:500;
}

.logo-text b{
  display:block;
  font-size:18px;
  font-weight:500;
}

.top-actions{
  margin-left:auto;
  height:58px;
  display:flex;
  align-items:center;
  padding-right:8px;
}

.top-action{
  width:48px;
  height:48px;
  border:0;
  background:transparent;
  color:#405000;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bell{
  position:relative;
  width:18px;
  height:19px;
}

.bell:before{
  content:"";
  position:absolute;
  left:3px;
  top:1px;
  width:12px;
  height:14px;
  border-radius:9px 9px 4px 4px;
  background:#455000;
}

.bell:after{
  content:"";
  position:absolute;
  left:1px;
  bottom:0;
  width:16px;
  height:3px;
  border-radius:3px;
  background:#455000;
}

.profile-icon{
  width:20px;
  height:20px;
  border-radius:50%;
  background:#455000;
  position:relative;
}

.profile-icon:before{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  left:6.5px;
  top:3px;
}

.profile-icon:after{
  content:"";
  position:absolute;
  width:12px;
  height:6px;
  border-radius:8px 8px 4px 4px;
  background:var(--green);
  left:4px;
  bottom:3px;
}


/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  top:58px;
  left:0;
  bottom:0;
  width:245px;
  background:var(--sidebar);
  color:#fff;
  z-index:90;
  overflow-y:auto;
  padding-top:8px;
}

.nav-item{
  min-height:45px;
  padding:0 22px;
  display:flex;
  align-items:center;
  color:#eee;
  font-size:14px;
  border-left:4px solid transparent;
  transition:.12s;
}

.nav-item:hover{
  background:#344143;
}

.nav-item.active{
  background:#344143;
  border-left-color:var(--green);
  font-weight:bold;
}


/* =========================
   MAIN
========================= */

.main{
  margin-left:245px;
  padding:82px 34px 50px;
  min-height:100vh;
  max-width:1450px;
}

.page-title{
  font-size:22px;
  font-weight:400;
  color:#555;
  margin:0 0 25px;
}

.school-year{
  font-size:14px;
  color:#777;
  margin:0 0 17px;
}

.card{
  border:1px solid #ddd;
  background:#fff;
}


/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  width:max-content;
  margin-bottom:10px;
}

.tab{
  min-width:69px;
  height:34px;
  padding:0 14px;
  border:1px solid #bbb;
  background:#f7f7f7;
  color:#666;
  margin-left:-1px;
}

.tab:first-child{
  margin-left:0;
}

.tab:hover{
  background:#eee;
}

.tab.active{
  background:var(--blue);
  border-color:#438ab7;
  color:#fff;
  font-weight:bold;
}

.term{
  font-size:12px;
  color:#777;
  margin:10px 0 14px;
}


/* =========================
   TABLES
========================= */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  border:1px solid #ddd;
  background:#fff;
}

th{
  height:42px;
  background:#e5e5e2;
  color:#555;
  font-size:12px;
  text-align:left;
  padding:0 14px;
  border-bottom:1px solid #ccc;
}

th.center{
  text-align:center;
}

td{
  height:47px;
  padding:0 14px;
  border-bottom:1px solid #ddd;
  font-size:13px;
}

td.center{
  text-align:center;
}

.course-link{
  color:var(--link);
  font-weight:600;
}

.total td{
  font-weight:bold;
  background:#fafafa;
}


/* =========================
   EDITABLE BOXES
========================= */

.edit{
  width:62px;
  height:30px;
  border:1px solid #aaa;
  border-radius:2px;
  background:#fff;
  text-align:center;
  color:#555;
}

.edit:hover{
  border-color:#4d98bf;
}

.edit:focus{
  outline:2px solid #4d98bf;
  outline-offset:1px;
  border-color:#4d98bf;
}

textarea.edit{
  width:100%;
  height:55px;
  text-align:left;
  padding:8px;
  resize:vertical;
}

select.edit{
  width:auto;
  min-width:110px;
}

.full-edit{
  width:100%;
  height:35px;
  text-align:left;
  padding:0 8px;
}

.note{
  font-size:11px;
  color:#888;
  margin-top:10px;
}


/* =========================
   HOME
========================= */

.home-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr 260px;
  gap:18px;
}

.profile-card,
.announcement-card,
.cart-card,
.quick-card{
  border:1px solid #ddd;
  background:#fff;
}

.profile-head{
  padding:18px;
  border-bottom:1px solid #ddd;
  display:flex;
  gap:18px;
}

.avatar{
  width:96px;
  height:116px;
  background:#e7d48b;
  border:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:12px;
}

.profile-info h2{
  font-size:17px;
  font-weight:400;
  margin:0 0 10px;
  color:#555;
}

.profile-info p{
  margin:6px 0;
  font-size:12px;
}

.section-title{
  font-size:12px;
  font-weight:bold;
  color:#777;
  padding:14px 15px 8px;
}

.quick-row{
  padding:12px 15px;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:space-between;
  font-size:12px;
}

.announcement-card{
  min-height:310px;
}

.announcement{
  padding:14px;
  border-top:1px solid #ddd;
}

.announcement h3{
  font-size:13px;
  margin:0 0 5px;
  color:#555;
}

.announcement p{
  font-size:12px;
  line-height:1.5;
  margin:5px 0;
}

.cart-card{
  text-align:center;
  padding:18px;
  min-height:145px;
}

.cart-card strong{
  display:block;
  font-size:12px;
}

.cart-btn{
  display:block;
  width:100%;
  height:34px;
  background:#fff;
  border:1px solid #bbb;
  margin-top:10px;
  color:#666;
}

.quick-card{
  margin-top:18px;
}

.small-btn{
  border:1px solid #bbb;
  background:#fff;
  padding:7px 12px;
  color:#666;
}

.small-btn:hover{
  background:#f3f3f3;
}


/* =========================
   GRADES
========================= */

.grade-card{
  border:1px solid #ddd;
  margin-top:16px;
}

.grade-header{
  padding:15px 16px;
  border-bottom:1px solid #ddd;
  color:#4c83a8;
  font-size:18px;
}

.grade-row{
  min-height:54px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
}

.grade-row:last-child{
  border-bottom:0;
}

.grade-label{
  font-size:13px;
  color:#777;
}

.grade-value{
  display:flex;
  align-items:center;
  gap:10px;
}


/* =========================
   ASSIGNMENTS
========================= */

.assignment-toolbar{
  display:flex;
  gap:5px;
  margin-bottom:10px;
}

.pill{
  height:28px;
  padding:0 12px;
  border:1px solid #bbb;
  background:#fff;
  color:#666;
}

.pill.active{
  background:#eee;
  font-weight:bold;
}

.assignment-date{
  font-size:12px;
  font-weight:bold;
  padding:10px 10px 6px;
  background:#fafafa;
  border-top:1px solid #ddd;
}

.assignment{
  min-height:50px;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:35% 25% 20% 20%;
  align-items:center;
  padding:0 12px;
}

.assignment-title{
  color:#555;
  font-weight:600;
}

.assignment-course{
  color:#777;
}

.status{
  font-size:10px;
  font-weight:bold;
  border:1px solid #d39b9b;
  color:#b66d6d;
  border-radius:12px;
  padding:5px 9px;
  width:max-content;
}

.score{
  text-align:right;
  color:#666;
}


/* =========================
   SCHEDULE
========================= */

.schedule-day{
  border:1px solid #ddd;
  margin-top:14px;
}

.day-label{
  padding:10px;
  background:#f2f2f2;
  font-size:11px;
  font-weight:bold;
  color:#777;
}

.period{
  display:grid;
  grid-template-columns:55px 1fr 1fr;
  min-height:72px;
  border-top:1px solid #ddd;
  align-items:center;
  padding:8px 14px;
}

.period-num{
  font-weight:bold;
  color:#777;
}

.subject{
  color:#4c83a8;
  font-weight:bold;
}

.subtext{
  font-size:11px;
  color:#777;
  margin-top:5px;
}

.teacher{
  font-size:12px;
  color:#666;
}


/* =========================
   FEES
========================= */

.fee-card{
  max-width:700px;
  border:1px solid #ddd;
  background:#fff;
}

.fee-row{
  min-height:55px;
  padding:0 18px;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.fee-row:last-child{
  border-bottom:0;
}

.fee-label{
  color:#666;
}

.fee-value{
  color:#555;
}


/* =========================
   STATIC PAGES
========================= */

.empty{
  padding:35px;
  text-align:center;
  color:#999;
  border:1px solid #ddd;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .sidebar{
    width:220px;
    transform:translateX(-100%);
    transition:.2s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    padding:80px 15px 40px;
  }

  .home-grid{
    grid-template-columns:1fr;
  }

  .assignment{
    grid-template-columns:1fr;
    gap:6px;
    padding:12px;
  }

  .period{
    grid-template-columns:45px 1fr;
  }

  .teacher{
    grid-column:2;
  }
}
</style>
</head>

<body>

<!-- =========================
     TOP BAR
========================= -->

<header class="topbar">

  <button
    class="menu-button"
    onclick="toggleMenu()"
    aria-label="Open menu">
    ☰
  </button>

  <div class="logo">

    <div class="logo-mark"></div>

    <div class="logo-text">
      Infinite
      <b>Campus</b>
    </div>

  </div>

  <div class="top-actions">

    <button
      class="top-action"
      title="Notifications">
      <span class="bell"></span>
    </button>

    <button
      class="top-action"
      title="User menu">
      <span class="profile-icon"></span>
    </button>

  </div>

</header>


<!-- =========================
     SIDEBAR
========================= -->

<aside class="sidebar" id="sidebar">

  <div class="nav-item active" data-page="home">
    Home
  </div>

  <div class="nav-item" data-page="calendar">
    Calendar
  </div>

  <div class="nav-item" data-page="assignments">
    Assignments
  </div>

  <div class="nav-item" data-page="grades">
    Grades
  </div>

  <div class="nav-item" data-page="gradebook">
    Grade Book Updates
  </div>

  <div class="nav-item" data-page="attendance">
    Attendance
  </div>

  <div class="nav-item" data-page="schedule">
    Schedule
  </div>

  <div class="nav-item" data-page="responsive">
    Responsive Schedule
  </div>

  <div class="nav-item" data-page="academic">
    Academic Plan
  </div>

  <div class="nav-item" data-page="food">
    Food Service
  </div>

  <div class="nav-item" data-page="fees">
    Fees
  </div>

  <div class="nav-item" data-page="documents">
    Documents
  </div>

  <div class="nav-item" data-page="messages">
    Message Center
  </div>

  <div class="nav-item" data-page="more">
    More
  </div>

</aside>


<!-- =========================
     PAGE AREA
========================= -->

<main class="main" id="app"></main>


<script>

/* =========================
   DATA
========================= */

const courses = [
  "Advisory",
  "Algebra 1",
  "Biology",
  "Engl Lang Arts 11",
  "Health & Wellness",
  "Personal/Financial Literacy",
  "Small Animal Vet Science",
  "US Govt & Economic Studies"
];


const attendanceCourses = {

  Q1:courses.map((name,i)=>({

    name,

    absent:[
      10,
      16,
      16,
      16,
      17,
      17,
      17,
      20
    ][i],

    tardy:[
      2,
      0,
      0,
      0,
      0,
      0,
      0,
      0
    ][i]

  })),

  Q2:courses.map(name=>({

    name,
    absent:0,
    tardy:0

  })),

  Q3:[
    "Advisory",
    "Algebra 1",
    "Biology",
    "Engl Lang Arts 11",
    "Individual & Dual Sports",
    "Intro to Health Careers",
    "US Govt & Economic Studies",
    "World Art & Culture"
  ].map(name=>({

    name,
    absent:0,
    tardy:0

  })),

  Q4:[
    "Advisory",
    "Algebra 1",
    "Biology",
    "Engl Lang Arts 11",
    "Individual & Dual Sports",
    "Intro to Health Careers",
    "US Govt & Economic Studies",
    "World Art & Culture"
  ].map(name=>({

    name,
    absent:0,
    tardy:0

  }))

};


const gradeCourses = [

  "Algebra 1",
  "Biology",
  "Engl Lang Arts 11",
  "Health & Wellness",
  "Personal/Financial Literacy",
  "Small Animal Vet Science",
  "US Govt & Economic Studies"

];


const terms = {

  Q1:"08/31/2026 - 11/03/2026",

  Q2:"11/04/2026 - 01/14/2027",

  Q3:"01/15/2027 - 03/31/2027",

  Q4:"04/01/2027 - 06/03/2027"

};


/* =========================
   HELPERS
========================= */

function esc(value){

  return String(value).replace(
    /[&<>"']/g,
    function(match){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      }[match];

    }
  );

}


function getSaved(key,fallback){

  const value = localStorage.getItem(key);

  if(value === null){
    return fallback;
  }

  return value;

}


function save(key,value){

  localStorage.setItem(key,value);

}


/* =========================
   MENU
========================= */

function toggleMenu(){

  document
    .getElementById("sidebar")
    .classList
    .toggle("open");

}


function setActive(page){

  document
    .querySelectorAll(".nav-item")
    .forEach(function(item){

      item.classList.toggle(
        "active",
        item.dataset.page === page
      );

    });

  document
    .getElementById("sidebar")
    .classList
    .remove("open");

}


function navigate(page){

  setActive(page);

  render(page);

  history.replaceState(
    null,
    "",
    "#" + page
  );

}


/* =========================
   EDITABLE INPUT
========================= */

function inputValue(
  key,
  fallback,
  type="number"
){

  return `
    <input
      class="edit ${type==="text" ? "full-edit" : ""}"
      type="${type}"
      value="${esc(getSaved(key,fallback))}"
      data-save="${esc(key)}"
    >
  `;

}


function wireInputs(){

  document
    .querySelectorAll("[data-save]")
    .forEach(function(element){

      element.addEventListener(
        "input",
        function(){

          save(
            element.dataset.save,
            element.value
          );

        }
      );

      element.addEventListener(
        "change",
        function(){

          save(
            element.dataset.save,
            element.value
          );

        }
      );

    });

}


/* =========================
   TABS
========================= */

function tabButtons(
  items,
  active
){

  return `

    <div class="tabs">

      ${items.map(function(item){

        return `

          <button
            class="tab ${item===active ? "active" : ""}"
            data-tab="${item}">
            ${item==="ALL" ? "All Terms" : item}
          </button>

        `;

      }).join("")}

    </div>

  `;

}


function wireTabs(
  selector,
  callback
){

  document
    .querySelectorAll(selector)
    .forEach(function(button){

      button.addEventListener(
        "click",
        function(){

          callback(
            button.dataset.tab
          );

        }
      );

    });

}


/* =========================
   ATTENDANCE
========================= */

function renderAttendance(term="Q1"){

  const rows = attendanceCourses[term];

  let absentTotal = 0;

  let tardyTotal = 0;


  rows.forEach(function(row,index){

    row.absent =
      Number(
        getSaved(
          "att-" + term + "-" + index,
          row.absent
        )
      ) || 0;

    row.tardy =
      Number(
        getSaved(
          "tardy-" + term + "-" + index,
          row.tardy
        )
      ) || 0;


    absentTotal += row.absent;

    tardyTotal += row.tardy;

  });


  document.getElementById("app").innerHTML = `

    <h1 class="page-title">
      Attendance
    </h1>

    <div class="school-year">
      26-27 HS Preble
    </div>

    ${tabButtons(
      ["Q1","Q2","Q3","Q4"],
      term
    )}

    <div class="term">
      Term ${term}
      &nbsp;
      (${terms[term]})
    </div>

    <div class="table-wrap">

      <table>

        <thead>

          <tr>

            <th>
              COURSE
            </th>

            <th class="center">
              ABSENT
            </th>

            <th class="center">
              TARDY
            </th>

          </tr>

        </thead>

        <tbody>

          ${rows.map(function(row,index){

            return `

              <tr>

                <td class="course-link">
                  ${esc(row.name)}
                </td>

                <td class="center">

                  ${inputValue(
                    "att-" + term + "-" + index,
                    row.absent
                  )}

                </td>

                <td class="center">

                  ${inputValue(
                    "tardy-" + term + "-" + index,
                    row.tardy
                  )}

                </td>

              </tr>

            `;

          }).join("")}


          <tr class="total">

            <td>
              Totals
            </td>

            <td
              class="center"
              id="attTotal">
              ${absentTotal}
            </td>

            <td
              class="center"
              id="tardyTotal">
              ${tardyTotal}
            </td>

          </tr>

        </tbody>

      </table>

    </div>

    <div class="note">
      All attendance boxes are editable and save automatically.
    </div>

  `;


  wireInputs();


  wireTabs(
    ".tab",
    function(tab){

      renderAttendance(tab);

    }
  );


  document
    .querySelectorAll("[data-save]")
    .forEach(function(element){

      element.addEventListener(
        "input",
        function(){

          let absent = 0;

          let tardy = 0;


          document
            .querySelectorAll(
              'input[data-save^="att-"]'
            )
            .forEach(function(input){

              absent +=
                Number(input.value) || 0;

            });


          document
            .querySelectorAll(
              'input[data-save^="tardy-"]'
            )
            .forEach(function(input){

              tardy +=
                Number(input.value) || 0;

            });


          document.getElementById(
            "attTotal"
          ).textContent = absent;


          document.getElementById(
            "tardyTotal"
          ).textContent = tardy;

        }
      );

    });

}


/* =========================
   GRADES
========================= */

function renderGrades(term="Q1"){

  document.getElementById("app").innerHTML = `

    <h1 class="page-title">
      Grades
    </h1>

    <div class="school-year">
      26-27 HS Preble
    </div>

    ${tabButtons(
      ["ALL","Q1","Q2","Q3","Q4"],
      term
    )}

    <div class="term">

      ${
        term === "ALL"
        ? "All Terms"
        : "Term " + term + " (" + terms[term] + ")"
      }

    </div>


    ${gradeCourses.map(function(course,index){

      const key =
        "grade-" +
        term +
        "-" +
        index;

      const defaultValue =
        term === "Q1"
        ? "1"
        : "";


      return `

        <div class="grade-card">

          <div class="grade-header">
            ${esc(course)}
          </div>

          <div class="grade-row">

            <span class="grade-label">

              Progress Grade
              ${term === "ALL" ? "" : term}

            </span>

            <span class="grade-value">

              ${inputValue(
                key,
                defaultValue
              )}

            </span>

          </div>

        </div>

      `;

    }).join("")}


    <div class="note">
      Grade boxes are editable and save automatically.
    </div>

  `;


  wireInputs();


  wireTabs(
    ".tab",
    function(tab){

      renderGrades(tab);

    }
  );

}

function renderCalendar(){

  renderSimple(
    "Calendar",
    '<div class="empty">Calendar events will appear here.</div>'
  );

}


function renderSimple(
  title,
  body
){

  document.getElementById("app").innerHTML = `

    <h1 class="page-title">
      ${title}
    </h1>

    ${body}

  `;

}


/* =========================
   PAGE ROUTING
========================= */

function render(page){

  if(page === "home"){
    return renderHome();
  }


  if(page === "attendance"){
    return renderAttendance("Q1");
  }


  if(page === "grades"){
    return renderGrades("Q1");
  }


  if(page === "assignments"){
    return renderAssignments();
  }


  if(page === "schedule"){
    return renderSchedule("Q1");
  }


  if(page === "fees"){
    return renderFees();
  }


  /* STATIC PAGES */

  if(page === "calendar"){

    return renderCalendar();

  }


  if(page === "gradebook"){

    return renderSimple(
      "Grade Book Updates",
      '<div class="empty">No grade book updates available.</div>'
    );

  }


  if(page === "responsive"){

    return renderSimple(
      "Responsive Schedule",
      '<div class="empty">Responsive schedule will appear here.</div>'
    );

  }


  if(page === "academic"){

    return renderSimple(
      "Academic Plan",
      '<div class="empty">Academic plan information will appear here.</div>'
    );

  }


  if(page === "food"){

    return renderSimple(
      "Food Service",
      '<div class="empty">Food service information will appear here.</div>'
    );

  }


  if(page === "documents"){

    return renderSimple(
      "Documents",
      '<div class="empty">No documents available.</div>'
    );

  }


  if(page === "messages"){

    return renderSimple(
      "Message Center",
      '<div class="empty">No messages available.</div>'
    );

  }


  if(page === "more"){

    return renderSimple(
      "More",
      '<div class="empty">Additional options will appear here.</div>'
    );

  }


  renderHome();

}


/* =========================
   SIDEBAR CLICKING
========================= */

document
  .querySelectorAll(".nav-item")
  .forEach(function(item){

    item.addEventListener(
      "click",
      function(){

        navigate(
          item.dataset.page
        );

      }
    );

  });


/* =========================
   START PAGE
========================= */

const allowedPages = [

  "home",
  "calendar",
  "assignments",
  "grades",
  "gradebook",
  "attendance",
  "schedule",
  "responsive",
  "academic",
  "food",
  "fees",
  "documents",
  "messages",
  "more"

];


const start =
  location.hash.replace("#","") ||
  "home";


render(
  allowedPages.includes(start)
  ? start
  : "home"
);
